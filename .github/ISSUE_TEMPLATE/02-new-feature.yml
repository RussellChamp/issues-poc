name: 💭 New Feature
description: Tell us about an idea you have for a new feature.
title: "[Feature]: "
labels: ["feature", "triage"]
projects: ["myproject"]
assignees:
  - me
type: feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your feature idea with us!
  - type: dropdown
    id: version
    attributes:
      label: Game Build
      description: What's the current version of the game were are playing? (This is to help us track whether we've already implemented a suggested feature.)
      options:
        - 0.123
        - 0.456
        - 0.789
      default: 0
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What kind of feature is this?
      options:
        - New Costume
        - New Map
        - Change to Existing Widget
        - Other
    validations:
      required: false
  - type: textarea
    id: feature-idea
    attributes:
      label: What is your suggested feature?
      description: How awesome is it?
      placeholder: Tell us what you want to see!
      value: "My really cool idea!"
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://example.com).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
  - type: upload
    id: crayon-drawings
    attributes:
      label: Upload pictures
      description: Add drawings of your feature idea (crayon only) to help explain what you would like to see
    validations:
      required: false
